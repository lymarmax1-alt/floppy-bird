<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Floppy Bird</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        background: #70c5ce;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        margin: auto;
        background: linear-gradient(#70c5ce, #ffffff);
    }

    #score {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        font-size: 36px;
        font-weight: bold;
        color: white;
        text-shadow: 2px 2px 4px black;
    }

    #info {
        position: absolute;
        bottom: 30px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 18px;
        text-shadow: 1px 1px 3px black;
    }
</style>
</head>
<body>

<div id="score">0</div>
<div id="info">Клик / пробел / тап — прыжок</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let bird = {
    x: canvas.width / 4,
    y: canvas.height / 2,
    radius: 15,
    velocity: 0,
};

let gravity = 0.5;
let jump = -8;

let pipes = [];
let pipeWidth = 70;
let gap = 180;

let score = 0;
let gameOver = false;

function resetGame() {
    bird.y = canvas.height / 2;
    bird.velocity = 0;
    pipes = [];
    score = 0;
    gameOver = false;
    document.getElementById("score").textContent = score;
}

function createPipe() {
    let topHeight = Math.random() * (canvas.height - gap - 200) + 50;
    pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - gap,
        passed: false
    });
}

setInterval(() => {
    if (!gameOver) createPipe();
}, 2000);

function drawBird() {
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
}

function drawPipes() {
    ctx.fillStyle = "black";
    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
    });
}

function update() {
    if (gameOver) return;

    bird.velocity += gravity;
    bird.y += bird.velocity;

    if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
        gameOver = true;
        document.getElementById("info").textContent = "Игра окончена. Клик для рестарта";
    }

    pipes.forEach(pipe => {
        pipe.x -= 3;

        if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
            pipe.passed = true;
            score++;
            document.getElementById("score").textContent = score;
        }

        if (
            bird.x + bird.radius > pipe.x &&
            bird.x - bird.radius < pipe.x + pipeWidth &&
            (bird.y - bird.radius < pipe.top ||
             bird.y + bird.radius > canvas.height - pipe.bottom)
        ) {
            gameOver = true;
            document.getElementById("info").textContent = "Игра окончена. Клик для рестарта";
        }
    });

    pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBird();
    drawPipes();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

function flap() {
    if (gameOver) {
        resetGame();
        document.getElementById("info").textContent = "Клик / пробел / тап — прыжок";
    } else {
        bird.velocity = jump;
    }
}

window.addEventListener("click", flap);
window.addEventListener("touchstart", flap);
window.addEventListener("keydown", e => {
    if (e.code === "Space") flap();
});
</script>

</body>
</html>
